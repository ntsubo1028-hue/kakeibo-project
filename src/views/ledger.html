<div class="kakeibo-card space-y-2.5">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
        <h2 class="kakeibo-card-title">
            <i data-lucide="book-open" class="w-4 h-4 text-indigo-600"></i> 総勘定元帳 (科目別明細)
        </h2>
        
        <div class="flex flex-wrap items-center gap-1.5 text-xs">
            <div>
                <span class="text-slate-500 mr-1">区分:</span>
                <select id="ledger-type-select" class="kakeibo-select bg-slate-50 font-semibold w-auto">
                    <option value="assets">資産</option>
                    <option value="liabilities">負債</option>
                    <option value="netAssets">純資産</option>
                    <option value="income">収益</option>
                    <option value="expenses">費用</option>
                </select>
            </div>
            <div>
                <span class="text-slate-500 mr-1">勘定科目:</span>
                <select id="ledger-account-select" class="kakeibo-select font-semibold w-auto"></select>
            </div>
            <div>
                <span class="text-slate-500 mr-1">補助科目:</span>
                <select id="ledger-sub-select" class="kakeibo-select font-semibold w-auto">
                    <option value="ALL">(すべての補助)</option>
                    <option value="NONE">(補助科目なし)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- フィルター＆コントロールバー -->
    <div class="kakeibo-filter-box flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex flex-wrap items-center gap-1.5">
            <div class="flex items-center gap-1">
                <span class="text-slate-500">期間:</span>
                <input type="date" id="filter-ledger-start" class="kakeibo-input w-24">
                <span>〜</span>
                <input type="date" id="filter-ledger-end" class="kakeibo-input w-24">
            </div>
            <div class="flex items-center gap-1">
                <span class="text-slate-500">金額:</span>
                <input type="number" id="filter-ledger-min" placeholder="Min" class="kakeibo-input w-16">
                <span>〜</span>
                <input type="number" id="filter-ledger-max" placeholder="Max" class="kakeibo-input w-16">
            </div>
            <div class="flex items-center gap-1">
                <span class="text-slate-500">表示順:</span>
                <select id="sort-ledger-order" class="kakeibo-select font-semibold w-auto">
                    <option value="date-asc" selected>日付昇順 (古い順)</option>
                    <option value="date-desc">日付降順 (新しい順)</option>
                    <option value="created-desc">入力順 (新しい順)</option>
                    <option value="created-asc">入力順 (古い順)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="kakeibo-table-container">
        <table class="kakeibo-table">
            <thead>
                <tr>
                    <th class="p-2">日付</th>
                    <th class="p-2">相手科目 (摘要)</th>
                    <th class="p-2 text-right">借方金額</th>
                    <th class="p-2 text-right">貸方金額</th>
                    <th class="p-2 text-right font-bold" id="ledger-th-balance">残高</th>
                    <th class="p-2 text-center no-print w-24">操作</th>
                </tr>
            </thead>
            <tbody id="ledger-tbody" class="divide-y divide-slate-100"></tbody>
        </table>
    </div>
</div>
