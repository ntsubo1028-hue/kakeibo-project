<div class="space-y-3">
    <!-- サマリーカード -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 no-print">
        <div class="kakeibo-card">
            <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-0.5">総資産残高</div>
            <div class="text-xs sm:text-lg font-extrabold text-slate-900 truncate" id="summary-total-assets">¥0</div>
        </div>
        <div class="kakeibo-card">
            <div class="text-[10px] font-semibold text-rose-600 uppercase tracking-wider mb-0.5">負債合計</div>
            <div class="text-xs sm:text-lg font-extrabold text-rose-700 truncate" id="summary-total-liabilities">¥0</div>
        </div>
        <div class="kakeibo-card">
            <div class="text-[10px] font-semibold text-emerald-600 uppercase tracking-wider mb-0.5">当月収入</div>
            <div class="text-xs sm:text-lg font-extrabold text-emerald-700 truncate" id="summary-month-income">¥0</div>
        </div>
        <div class="kakeibo-card">
            <div class="text-[10px] font-semibold text-indigo-600 uppercase tracking-wider mb-0.5">当月支出</div>
            <div class="text-xs sm:text-lg font-extrabold text-indigo-700 truncate" id="summary-month-expense">¥0</div>
        </div>
    </div>

    <!-- 新規記帳フォーム -->
    <div class="kakeibo-card space-y-3">
        <div class="kakeibo-card-header">
            <h2 class="kakeibo-card-title">
                <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-600"></i> 新規取引の記帳 (複式仕訳)
            </h2>
            <div class="flex items-center gap-2 text-xs">
                <span class="text-slate-500 font-medium">入力モード:</span>
                <select id="input-mode" class="k-select p-1 border rounded bg-slate-50 font-semibold text-slate-700 text-xs">
                    <option value="simple" selected>通常モード (簡単)</option>
                    <option value="compound">複式自由モード (借方/貸方指定)</option>
                </select>
            </div>
        </div>
        <!-- テンプレート領域 -->
        <div class="kakeibo-filter-box space-y-2">
            <div class="flex items-center justify-between flex-wrap gap-2 border-b border-slate-200 pb-2">
                <!-- 左側：カテゴリタブ -->
                <div id="template-category-tabs" class="flex items-center gap-1.5 flex-wrap items-center"></div>
                
                <!-- 右側：編集モード・カテゴリ操作 ＋ 現在の内容を登録ボタン -->
                <div class="flex items-center gap-1.5 items-center">
                    <div id="template-extra-controls" class="flex items-center gap-1.5 items-center"></div>
                    <button type="button" id="btn-add-template" class="h-7 px-3 text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg inline-flex items-center justify-center shadow-sm transition shrink-0">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> 現在の内容を登録
                    </button>
                </div>
            </div>
            <!-- 仕訳ボタン表示エリア -->
            <div id="template-buttons-container" class="flex flex-wrap gap-1.5 items-center min-h-[28px]"></div>
        </div>

        <form id="transaction-form" class="space-y-2.5">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <div>
                    <label class="kakeibo-label">日付</label>
                    <input type="date" id="tx-date" required class="kakeibo-input">
                </div>
                <div class="sm:col-span-2">
                    <label class="kakeibo-label">摘要 / メモ</label>
                    <input type="text" id="tx-memo" placeholder="例: スーパーで食材購入" class="kakeibo-input">
                </div>
            </div>

            <!-- 通常モード -->
            <div id="mode-simple-container" class="space-y-2 bg-emerald-50/40 p-2.5 rounded-md border border-emerald-100">
                <div>
                    <label class="kakeibo-label text-slate-700">取引種別</label>
                    <select id="simple-type" class="kakeibo-input w-full sm:w-1/3 font-semibold bg-white">
                        <option value="expense">日常の支出 (費用発生)</option>
                        <option value="income">収入 (給与・売上等)</option>
                        <option value="transfer">口座振替・引き出し</option>
                        <option value="credit">クレジット利用 (未払金)</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-0.5">
                    <div class="bg-white p-2 rounded border border-emerald-200 space-y-1.5">
                        <div class="text-[11px] font-bold text-emerald-900" id="simple-group1-title">【1. 何に支払ったか (費用)】</div>
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="kakeibo-label" id="simple-cat1-label">科目</label><select id="simple-cat1" class="kakeibo-input"></select></div>
                            <div><label class="kakeibo-label">補助科目</label><select id="simple-sub1" class="kakeibo-input"><option value="">(補助なし)</option></select></div>
                        </div>
                    </div>
                    <div class="bg-white p-2 rounded border border-emerald-200 space-y-1.5">
                        <div class="text-[11px] font-bold text-emerald-900" id="simple-group2-title">【2. どこから支払ったか】</div>
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="kakeibo-label" id="simple-cat2-label">科目</label><select id="simple-cat2" class="kakeibo-input"></select></div>
                            <div><label class="kakeibo-label">補助科目</label><select id="simple-sub2" class="kakeibo-input"><option value="">(補助なし)</option></select></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 複式自由モード -->
            <div id="mode-compound-container" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-2.5 bg-indigo-50/40 p-2.5 rounded-md border border-indigo-100">
                <div class="space-y-1.5 border-b sm:border-b-0 sm:border-r border-indigo-200 pb-2 sm:pb-0 sm:pr-2.5">
                    <h3 class="text-[11px] font-bold text-indigo-900 uppercase">【借方 (Debit)】</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="kakeibo-label">科目</label><select id="comp-debit-account" class="kakeibo-input"></select></div>
                        <div><label class="kakeibo-label">補助</label><select id="comp-debit-sub" class="kakeibo-input"><option value="">(補助なし)</option></select></div>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <h3 class="text-[11px] font-bold text-indigo-900 uppercase">【貸方 (Credit)】</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="kakeibo-label">科目</label><select id="comp-credit-account" class="kakeibo-input"></select></div>
                        <div><label class="kakeibo-label">補助</label><select id="comp-credit-sub" class="kakeibo-input"><option value="">(補助なし)</option></select></div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 items-end pt-0.5">
                <div>
                    <label class="kakeibo-label">金額 (円)</label>
                    <input type="number" id="tx-amount" min="1" required placeholder="5000" class="kakeibo-input font-bold">
                </div>
                <div class="sm:col-span-2 flex justify-end gap-2 items-center">
                    <button type="submit" class="btn-primary">
                        <i data-lucide="check" class="w-3.5 h-3.5"></i> 仕訳を登録する
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
